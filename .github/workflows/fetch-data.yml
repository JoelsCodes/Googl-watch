# Downloads daily price history for the research experiments in research/ and commits it to the "data" branch.
# Run it from the Actions tab (Fetch price data → Run workflow). The app itself does not use these files.
name: Fetch price data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance==0.2.54 pandas
      - name: Download
        run: |
          mkdir out && cd out
          python - <<'PY'
          import yfinance as yf
          syms = ["GOOGL", "QQQ", "SPY", "^VIX", "^TNX", "MSFT", "AAPL", "AMZN", "META", "NVDA"]
          for s in syms:
              df = yf.download(s, start="2004-08-01", auto_adjust=True, progress=False, multi_level_index=False)
              if df.empty:
                  raise SystemExit(f"no data for {s}")
              df.index.name = "date"
              df.round(4).to_csv(s.replace("^", "") + ".csv")
              print(s, len(df), df.index[0].date(), df.index[-1].date())
          # intraday: Yahoo keeps 60 days of 5-minute bars and 730 days of hourly bars
          for s in ["GOOGL", "QQQ"]:
              for iv, per in [("5m", "60d"), ("1h", "730d")]:
                  df = yf.download(s, period=per, interval=iv, auto_adjust=True, progress=False, multi_level_index=False)
                  if df.empty:
                      raise SystemExit(f"no {iv} data for {s}")
                  df.index.name = "date"
                  df.round(4).to_csv(f"{s}_{iv}.csv")
                  print(s, iv, len(df), df.index[0], df.index[-1])
          PY
      - name: Commit to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Price data $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
